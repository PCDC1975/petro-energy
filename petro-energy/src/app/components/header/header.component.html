<header class="fixed top-0 left-0 right-0 z-50 bg-blue-950 backdrop-blur-sm">
  <div class="container mx-auto px-6">
    <nav class="flex items-center justify-between h-16 sm:h-20">
      <!-- Logo -->
      <a routerLink="/" class="flex items-center gap-2 shrink-0">
        <img src="/logo.png" alt="Petro Energy" class="h-30 w-30">
        <span class="text-amber-300 font-bold text-xl tracking-tight">
          Petro Energy
        </span>
      </a>

      <!-- Desktop Menu -->
      <ul class="hidden md:flex items-center gap-8">
        @for (item of navItems; track item.path) {
          <li>
            <a routerLink="{{item.path}}"
              [style.color]="'#FFDF00'"
              routerLinkActive="text-primary-foreground"
              [routerLinkActiveOptions]="{exact: true}"
              class="text-sm font-semibold tracking-wide uppercase transition-colors text-primary-foreground/70 hover:text-primary-foreground">
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </nav>
  </div>
 
</header>
