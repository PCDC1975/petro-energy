<div class="pt-12 pb-20" *ngIf="post">
  <div class="container mx-auto px-6 max-w-4xl">

    <a routerLink="/" class="inline-flex items-center gap-2 text-blue-600 hover:text-blue-700 mb-8">
      ← Voltar para Início
    </a>

    <img [src]="post.image" [alt]="post.title"
         class="w-full h-[420px] object-cover rounded-3xl mb-10">

    <h1 class="text-4xl md:text-5xl text-center font-bold leading-tight mb-6">{{ post.title }}</h1>

    <p class="text-zinc-500 dark:text-zinc-400 mb-10">{{ post.date }}</p>

    <div class="prose dark:prose-invert max-w-none text-lg text-justify leading-relaxed"
         [innerHTML]="post.content">
    </div>

  </div>
</div>
